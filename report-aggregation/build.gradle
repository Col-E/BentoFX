plugins {
	id 'bento.project.project-convention'
	id 'bento.test.integration-test-graphical-suite'
	id 'bento.test.integration-test-parallel-suite'
	id 'bento.test.integration-test-suite'
	id 'bento.report.test-aggregation'
	id 'bento.report.jacoco-aggregation'
}

description = 'Aggregated reports for BentoFX library modules.'

// Set by 'bento.report.aggregation-settings' once settings have been
// evaluated, as an extra property on this project alone. Reading it from a
// 'Gradle' extension instead would break Isolated Projects, which forbids a
// project from reading shared build state.
def reportAggregationProjects = project.reportAggregationProjects

dependencies {
	reportAggregationProjects.each { String projectPath ->
		def projectToReport = project(projectPath)
		jacocoAggregation(projectToReport)
		testReportAggregation(projectToReport)
	}
}

dependencyAnalysis {
	issues {
		onUnusedDependencies {
			// Exclude additional, common testing dependencies that we apply to
			// all projects regardless of use (for the sake of convenience).
			exclude(
				'org.testfx:testfx-junit5',
				'org.testfx:testfx-core',
			)
			// plugin conventions add the current project as a dependency
			exclude(":report-aggregation")
		}
	}
}
