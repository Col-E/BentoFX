import static net.ltgt.gradle.errorprone.CheckSeverity.OFF

plugins {
    alias(libs.plugins.buildconfig)
    alias(libs.plugins.javafx)
    id 'bento.project.project-convention'
    id 'bento.release.publish-convention'
}

description = 'A docking system for JavaFX'

javafx {
    modules = ['javafx.base', 'javafx.controls', 'javafx.graphics']

    // We don't want to include a specific version of JavaFX as a transitive
    // dependency for users of the library.
    configurations = ['compileOnlyApi', 'testImplementation']
}

javadoc {
    options {
        // Only the public API exposed in module-info.java; configure Javadoc
        // to match it.
        showFromPublic()
        addBooleanOption('Xdoclint:all,-missing', true)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.errorprone.check('BadInstanceof', OFF)
    options.errorprone.check('MissingSummary', OFF)
    options.errorprone.check('ReferenceEquality', OFF)
    options.errorprone.check('StringSplitter', OFF)
    options.errorprone.check('UnnecessaryParentheses', OFF)
}

// Col-E's core unit tests use TestFX.
dependencies {
    testImplementation libs.testfx
    testImplementation libs.testfx.core
    testRuntimeOnly libs.testfx.monocle
}

// Run JavaFX tests headless so they work on CI runners without a display.
test {
    systemProperty 'testfx.robot', 'glass'
    systemProperty 'testfx.headless', 'true'
    systemProperty 'glass.platform', 'Monocle'
    systemProperty 'monocle.platform', 'Headless'
    systemProperty 'prism.order', 'sw'
}

buildConfig {
    useJavaOutput()
    className("BentoVersion")
    packageName("software.coley.bentofx")
    buildConfigField(String, "VERSION", provider { "${project.version}" })
    buildConfigField(String, "BUILD_DATE", provider { "${new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")}" })
}
