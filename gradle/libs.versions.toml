[versions]
# noinspection UnusedVersionCatalogEntry
maven-group = "software.coley.bento-fx"
# noinspection UnusedVersionCatalogEntry
bentofx = "0.16.1-SNAPSHOT"
# noinspection UnusedVersionCatalogEntry
gradle-wrapper = "9.8.1"
# noinspection UnusedVersionCatalogEntry
gradle-checksum = "dce76f55f8e251a3a1f130eb120f30b3d271de2b76c9b0729d316b5a1b6dc01f"
# noinspection UnusedVersionCatalogEntry
java-jdk = "21"

# Libraries
assertj = "3.27.7"
errorprone = "2.50.0"
javafx = "21.0.12"
jspecify = "1.0.1"
junit = "6.1.3"
nullaway = "0.14.2"
testfx = "4.0.18"
testfx-monocle = "21.0.2"

# Plugins
ben-manes-versions-plugin = "0.57.0"
buildconfig = "6.1.2"
dependency-analysis-gradle-plugin = "3.19.2"
errorprone-plugin = "5.1.1"
# noinspection UnusedVersionCatalogEntry
jacoco = "0.8.15"
javafx-plugin = "0.1.0"
jreleaser = "1.26.0"
nullaway-plugin = "3.2.0"

[libraries]
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
ben-manes-versions-gradlePlugin-dependency = { module = "io.github.ben-manes.versions:io.github.ben-manes.versions.gradle.plugin", version.ref = "ben-manes-versions-plugin" }
dependencyAnalysis-buildHealth-gradlePlugin-dependency = { module = "com.autonomousapps.build-health:com.autonomousapps.build-health.gradle.plugin", version.ref = "dependency-analysis-gradle-plugin" }
dependencyAnalysis-gradlePlugin-dependency = { module = "com.autonomousapps.dependency-analysis:com.autonomousapps.dependency-analysis.gradle.plugin", version.ref = "dependency-analysis-gradle-plugin" }
# noinspection UnusedVersionCatalogEntry
errorprone = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
errorprone-gradlePlugin-dependency = { module = "net.ltgt.errorprone:net.ltgt.errorprone.gradle.plugin", version.ref = "errorprone-plugin" }
javafx-base = { module = "org.openjfx:javafx-base", version.ref = "javafx" }
javafx-controls = { module = "org.openjfx:javafx-controls", version.ref = "javafx" }
javafx-gradlePlugin-dependency = { module = "org.openjfx.javafxplugin:org.openjfx.javafxplugin.gradle.plugin", version.ref = "javafx-plugin" }
javafx-graphics = { module = "org.openjfx:javafx-graphics", version.ref = "javafx" }
jreleaser-gradlePlugin-dependency = { module = "org.jreleaser:org.jreleaser.gradle.plugin", version.ref = "jreleaser" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
# noinspection UnusedVersionCatalogEntry
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
nullaway-annotations = { module = "com.uber.nullaway:nullaway-annotations", version.ref = "nullaway" }
nullaway-gradlePlugin-dependency = { module = "net.ltgt.nullaway:net.ltgt.nullaway.gradle.plugin", version.ref = "nullaway-plugin" }
testfx = { module = "org.testfx:testfx-junit5", version.ref = "testfx" }
testfx-core = { module = "org.testfx:testfx-core", version.ref = "testfx" }
testfx-monocle = { module = "org.testfx:openjfx-monocle", version.ref = "testfx-monocle" }

[bundles]
annotations = ["jspecify"]
javafx = [ "javafx-base", "javafx-controls", "javafx-graphics", ]
test-libraries = ["assertj", "testfx", "testfx-core", "testfx-monocle"]

[plugins]
buildconfig = { id = "com.github.gmazzo.buildconfig", version.ref = "buildconfig" }
# noinspection UnusedVersionCatalogEntry
dependencyAnalysis-buildHealth = { id = "com.autonomousapps.build-health", version.ref = "dependency-analysis-gradle-plugin" }
# noinspection UnusedVersionCatalogEntry
dependencyAnalysis-gradlePlugin = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependency-analysis-gradle-plugin" }
# noinspection UnusedVersionCatalogEntry
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
javafx = { id = "org.openjfx.javafxplugin", version.ref = "javafx-plugin" }
jreleaser = { id = "org.jreleaser", version.ref = "jreleaser" }
# noinspection UnusedVersionCatalogEntry
nullaway = { id = "net.ltgt.nullaway", version.ref = "nullaway-plugin" }
