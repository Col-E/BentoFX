plugins {
	id 'maven-publish'
}

// Modules applying 'bento.project.project-convention' (java-library) get their
// artifactId/name from its 'bentoConvention' extension. Gradle does not allow
// combining java-library and java-platform on one project, so some modules
// (e.g. 'java-platform' ) can't apply that convention and must fall back to the
// plain project name, which is used here.

publishing {
	publications.withType(MavenPublication).configureEach {
		pom {
			url.set('https://github.com/Col-E/BentoFX')
			inceptionYear.set('2025')

			licenses {
				license {
					name.set('MIT')
					url.set('https://spdx.org/licenses/MIT.html')
				}
			}
			developers {
				developer {
					id = 'Col-E'
					name = 'Matt Coley'
				}
				developer {
					id.set('philliplbryant')
					name.set('Phil Bryant')
				}
			}
			scm {
				connection.set('scm:git:https://github.com/Col-E/BentoFX.git')
				developerConnection.set('scm:git:ssh://github.com/Col-E/BentoFX.git')
				url.set('https://github.com/Col-E/BentoFX')
			}
		}
	}

	repositories {
		mavenLocal()
		maven {
			url = uri(layout.buildDirectory.dir('staging-deploy'))
		}
	}
}
