# The text LayoutsMenu shows, in the one language this framework carries.
#
# Translating this file: copy it to LayoutsMenu_<language>.properties beside
# this one - LayoutsMenu_de.properties, LayoutsMenu_pt_BR.properties - and
# translate the values. Java reads these files as UTF-8, so write the target
# language directly; no \uXXXX escaping.
#
# An application that would rather supply its own text, from its own bundle,
# hands a ResourceBundle to the LayoutsMenu constructor instead. It has to carry
# every key below.
#
# Two things a translator owns, beyond the words:
#
# 1. Mnemonics. An underscore marks the following letter as the menu mnemonic:
#    "_Delete" underlines the D. Choose letters that suit the translated words,
#    and keep them distinct within a single menu - nothing checks that, and two
#    items sharing a mnemonic leaves one of them unreachable by keyboard.
#
#    The items listing saved layouts are not here and carry no mnemonic: a user
#    names those, and there are as many of them as layouts saved. The two
#    stand-ins below take none either, being disabled. Both have mnemonic
#    parsing switched off, so an underscore in either shows as an underscore.
#
# 2. Placeholders. Only the three values holding {0} are read as MessageFormat
#    patterns. In those three, and only those three, a literal apostrophe has to
#    be doubled ('' rather than '), because MessageFormat reads a single one as
#    quoting - and {0} itself must not be quoted, or the layout name never gets
#    substituted. Everywhere else an apostrophe is just an apostrophe.

# Menus and items
menu.layouts = _Layouts
menu.custom = _Custom
menu.restore = _Restore
menu.rename = R_ename
menu.moveToGroup = _Move to Group
menu.delete = _Delete
menu.groups = _Groups
menu.renameGroup = _Rename Group
menu.deleteGroup = _Delete Group
item.default = _Default
item.saveAsNew = Save Current Layout as _New...
item.saveChanges = _Save Changes
item.newGroup = _New Group...

# Stand-ins shown when there is nothing to list. An empty menu opens as an
# empty popup, which reads as a fault rather than as an answer.
item.listFailed = Could not list saved layouts
item.noLayouts = No saved layouts
item.noGroups = No groups yet

# The entry in a group picker that means "in no group at all". Not a group name,
# so it is bracketed to keep it apart from the names a user chose.
choice.noGroup = (No Group)

# Dialogs
dialog.title = Docking Layouts
dialog.saveAsNew.title = Save Current Layout as New
dialog.saveAsNew.prompt = Name for this layout:
dialog.saveAsNew.groupPrompt = Group for this layout:
dialog.rename.title = Rename Layout
dialog.rename.prompt = New name for this layout:
dialog.moveToGroup.title = Move Layout to Group
dialog.moveToGroup.prompt = Group for this layout:
dialog.newGroup.title = New Group
dialog.newGroup.prompt = Name for this group:
dialog.renameGroup.title = Rename Group
dialog.renameGroup.prompt = New name for this group:

# Something could not be done
error.restoreFailed.header = Could not restore that layout.
error.restoreFailed.content = The layout could not be read, or does not fit \
  this application. The layout showing now has been left as it is.
error.saveFailed.header = Could not save the layout.
error.deleteFailed.header = Could not delete the layout.
error.blankName.header = Cannot rename a layout to a blank name.
error.blankName.content = Type a name for the layout, or cancel to keep the \
  one it has.
error.cannotSaveNamed.header = Cannot save a layout named "{0}".
error.notStored.header = That layout is no longer saved.
error.listGroupsFailed.header = Could not list the groups.
error.groupFailed.header = Could not create the group.
error.renameGroupFailed.header = Could not rename the group.
error.deleteGroupFailed.header = Could not delete the group.
error.cannotNameGroup.header = Cannot name a group "{0}".

# Asking before something that cannot be undone
confirm.replace.header = Replace the layout stored as "{0}"?
confirm.replace.content = A layout is already stored under that name. \
  Replacing it cannot be undone.
confirm.delete.header = Delete the layout "{0}"?
confirm.delete.content = The stored layout is removed. The layout showing now \
  is not changed.
confirm.deleteGroup.header = Delete the group "{0}"?
confirm.deleteGroup.content = The group is removed. The layouts in it are kept \
  and end up in no group.

# Why a name a user typed cannot address a layout. Only these three can come
# of a name put through LayoutNames.toIdentifier; anything else falls back to
# the framework's own sentence, which is in this framework's language only.
problem.blank = That name has no letters or digits in it, so there is nothing \
  to store the layout under. Include at least one letter or digit.
problem.reserved = That name is reserved for the layout this application saves \
  on its own. Choose another.
problem.deviceName = That name is one the operating system reserves for a \
  device, so it cannot be a file. Choose another.

# Why a name a user typed cannot be a group. A group name is stored as it was
# typed and no file is named after it, so the rules above do not apply to one.
problem.blankGroup = A group needs a name. Type one, or cancel.
problem.groupTooLong = That name is longer than {0} characters. Choose a \
  shorter one.
problem.duplicateGroup = A group of that name already exists. Choose another.
