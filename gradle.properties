org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
# Performance optimization for multi-project builds - only configures the root
# project and the specific subprojects required for the requested task.
org.gradle.configureondemand=true
# Increased heap size needed to prevent OutOfMemoryError during the buildHealth
# task
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
# TODO enhancement/issue-13: Enable isolated projects check. It is currently disabled due to:
#   https://github.com/jreleaser/jreleaser/issues/2150
#     Still reproduces on JReleaser 1.26.0: 'jreleaserConfig' fails with
#     "use of 'Project.getProperties()' is not allowed with Isolated Projects".
#   https://youtrack.jetbrains.com/issue/IDEA-391303/Gradle-sync-fails-with-Isolated-Projects-Plugin-class-JetGradlePlugin-use-of-Project.getProperties-is-not-allowed
# and manifests itself when syncing the project in IntelliJ
org.gradle.unsafe.isolated-projects=false
# Explicitly enable filesystem watching so Gradle doesn't go through its
# default of trying to evaluate whether it can be enabled automatically, which
# can be slow:
# https://github.com/gradle/gradle/issues/17955.
org.gradle.vfs.watch=true
dependency.analysis.print.build.health=true
