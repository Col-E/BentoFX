plugins {
	id 'groovy-gradle-plugin'
	id 'java-gradle-plugin'
}

/**
 * This included build produces a settings plugins, not build convention
 * plugins. Gradle evaluates it from settings.gradle during settings evaluation,
 * before project configuration. Keep settings-time discovery and decisions here.
 * Put normal project plugin application, dependency setup, task wiring, and
 * other configurations in build-logic instead.
 */
description = 'Discovers projects and decides which projects participate in the ' +
		'aggregation project. Runs before Gradle configures projects.'

def versionCatalog = versionCatalogs.named('libs')
def jdkVersion = versionCatalog.findVersion("java-jdk").get().requiredVersion
def javaLanguageVersion = JavaLanguageVersion.of(jdkVersion)

java {
	toolchain {
		languageVersion = javaLanguageVersion
	}
}

dependencies {
	implementation libs.ben.manes.versions.gradlePlugin.dependency
	implementation libs.dependencyAnalysis.buildHealth.gradlePlugin.dependency
}

gradlePlugin {
	plugins {
		dagpSettingsPlugin {
			id = 'bento.analysis.dagp-settings'
			implementationClass =
					'software.coley.gradle.plugin.analysis.DagpSettingsPlugin'
		}
		reportAggregationProjectsSettingsPlugin {
			id = 'bento.report.aggregation-settings'
			implementationClass =
					'software.coley.gradle.plugin.report.ReportAggregationSettingsPlugin'
		}
		benManesVersionsSettingsPlugin {
			id = 'bento.analysis.ben-manes-versions-settings'
			implementationClass =
					'software.coley.gradle.plugin.analysis.BenManesVersionsSettingsPlugin'
		}
	}
}
