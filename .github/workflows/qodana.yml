name: Qodana

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  security-events: write

jobs:
  qodana:
    name: Qodana JVM analysis
    # The SARIF upload below goes to this repository's code scanning, so the job
    # runs only here, the way build.yml gates its SonarQube steps.
    if: github.repository == 'philliplbryant/BentoFX'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
      QODANA_ENDPOINT: https://qodana.cloud
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The Community linter named in qodana.yaml needs no license, so it runs
      # with or without QODANA_TOKEN. The token only uploads the report to
      # Qodana Cloud; a pull request from a fork gets no secrets, so there the
      # analysis still runs and the upload is skipped.
      - name: Run Qodana
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        with:
          args: |
            --within-docker false
          upload-result: true
      - name: Upload Qodana SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4.39.0
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
